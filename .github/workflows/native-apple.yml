name: Native Apple management

on:
  pull_request:
  push:
    branches: [main, 'feature/**']

permissions:
  contents: read

jobs:
  windows-bootstrap-key:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Native protected bootstrap key provisioning
        run: go test -count=1 -run TestBootstrapSigningKey ./internal/desktop
      - name: Native protected vendor signing files
        run: go test -count=1 -run "VendorSigningFiles|VendorPrivateKey" ./internal/mdm/apple
      - name: APNs certificate connection protocol
        run: go test -count=1 -run TestAPNsCheck ./internal/mdm/apple
      - name: SCEP signatures, encryption and parser boundaries
        run: go test -count=1 -run TestSCEP ./internal/mdm/apple
      - name: Automated Device Enrollment signatures and service protocol
        run: go test -count=1 ./internal/mdm/ade
      - name: Native Windows enrollment, CA cryptography and TLS boundaries
        run: go test -count=1 ./internal/mdm/windows
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openuem_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: openuem_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openuem_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APPLE_MDM_TEST_DATABASE_URL: postgres://openuem_test:local-test-only@127.0.0.1:5432/openuem_test?sslmode=disable
      AGENT_ENROLLMENT_TEST_DATABASE_URL: postgres://openuem_test:local-test-only@127.0.0.1:5432/openuem_test?sslmode=disable
      WINDOWS_MDM_TEST_DATABASE_URL: postgres://openuem_test:local-test-only@127.0.0.1:5432/openuem_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - name: Native Windows policy, CA and credential persistence
        run: go test -race -count=1 ./internal/mdm/windows
      - name: Bounded Windows discovery parser fuzzing
        run: go test -run '^$' -fuzz=FuzzDiscovery -fuzztime=15s -parallel=2 ./internal/mdm/windows
      - name: Bounded Windows enrollment policy parser fuzzing
        run: go test -run '^$' -fuzz=FuzzPolicyRequest -fuzztime=15s -parallel=2 ./internal/mdm/windows
      - run: go tool templ generate
      - name: Compile protocol and console tests before long database checks
        run: go test -race -run '^$' ./internal/mdm/ade ./internal/mdm/apple ./internal/notifications ./internal/controllers/webserver ./internal/controllers/webserver/handlers ./internal/views/mdm_views
      - name: Render synthetic console states before database regression
        run: go test -race -count=1 ./internal/views/mdm_views
        env:
          APPLE_MDM_UI_ARTIFACTS: ${{ runner.temp }}/apple-mdm-ui
      - name: Preserve synthetic console renderings for browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-mdm-ui
          path: ${{ runner.temp }}/apple-mdm-ui
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Certificate and network forms in Chrome
        timeout-minutes: 5
        run: node tests/browser/run.mjs
        env:
          APPLE_MDM_UI_ARTIFACTS: ${{ runner.temp }}/apple-mdm-ui
          BROWSER_TEST_ARTIFACTS: ${{ runner.temp }}/apple-mdm-browser
      - name: Preserve browser regression results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-mdm-browser
          path: ${{ runner.temp }}/apple-mdm-browser
          if-no-files-found: ignore
          retention-days: 7
      - name: Scoped console routes and response privacy
        run: go test -race -count=1 ./internal/controllers/webserver/handlers
      - name: Protocol, persistence and TLS
        run: go test -race -count=1 -timeout=20m ./internal/mdm/ade ./internal/mdm/apple ./internal/notifications ./internal/controllers/webserver
      - name: Gateway identity, route isolation, certificate login and CSRF
        run: go test -race -count=1 ./internal/security/clientidentity ./internal/security/access ./internal/security/audit ./internal/views/audit_views ./internal/gateway ./internal/controllers/authserver/handlers ./internal/controllers/router/...
      - name: Existing Windows deployment and SMTP settings models
        run: go test -count=1 -run 'TestDeploymentTestSuite|TestSMTPTestSuite' ./internal/models
      - name: Individual agent authorization and command service lifecycles
        run: go test -race -count=1 ./internal/desktop/...
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - run: go tool templ generate
      - run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
          CGO_ENABLED: '0'
